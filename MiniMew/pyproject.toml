[project]
name = "minimew"
version = "0.1.0"
description = "MiniMew staged learning backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "asyncpg>=0.30,<1",
    "cryptography>=46,<51",
    "fastapi<1",
    "httpx2>=2.12,<3",
    "langchain-core>=1.4.7,<2",
    "langchain-openai==1.7.3",
    "langgraph>=1,<2",
    "langsmith>=0.14.9,<1",
    "markdown-it-py>=4.2,<5",
    "openai>=2.45,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.33",
    "redis==8.1.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tokenizers>=0.20,<1",
    "uvicorn<1",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=6.2,<7",
    "huggingface-hub>=1.3,<3",
    "torch>=2.2,<3",
]
vector = [
    "pymilvus==3.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
