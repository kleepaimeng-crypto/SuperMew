[project]
name = "minimew"
version = "0.1.0"
description = "MiniMew staged learning backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "asyncpg>=0.30,<1",
    "fastapi<1",
    "httpx2>=2.12,<3",
    "langchain-core>=1.4.7,<2",
    "langchain-deepseek==1.1.1",
    "langsmith>=0.14.9,<1",
    "openai>=2.45,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.33",
    "redis==8.1.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
